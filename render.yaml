services:
  - type: web
    name: assaylens-research
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python scripts/verify_deploy.py
    startCommand: uvicorn render_app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ASSAYLENS_SITE_USERNAME
        sync: false
      - key: ASSAYLENS_SITE_PASSWORD
        sync: false
